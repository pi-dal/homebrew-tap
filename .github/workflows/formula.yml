name: Homebrew packages
on:
  push:
  pull_request:

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Refresh Homebrew metadata (runner images can be stale)
        run: brew update
      - name: Tap checked-out repository
        run: brew tap --custom-remote pi-dal/tap "file://${{ github.workspace }}"
      - name: Audit and style
        run: |
          brew audit --strict pi-dal/tap/sakamoto pi-dal/tap/voicepi pi-dal/tap/agent-explorer
          brew style pi-dal/tap/sakamoto pi-dal/tap/voicepi pi-dal/tap/agent-explorer
      - name: Install from source
        run: brew install --build-from-source pi-dal/tap/sakamoto
      - name: CLI and formula smoke tests
        run: |
          brew test pi-dal/tap/sakamoto
          sakamoto version
          test -f "$(brew --prefix)/share/sakamoto/scripts/install-macos.sh"
          test -f "$(brew --prefix)/share/sakamoto/launchd/dev.sakamoto.daemon.plist.in"
          test -f "$(brew --prefix)/share/sakamoto/NOTICE.md"
          test -f "$(brew --prefix)/share/sakamoto/portrait-license.md"
      - name: Verify desktop cask when published
        if: hashFiles('Casks/sakamoto-desktop.rb') != ''
        run: |
          brew audit --cask --strict --online pi-dal/tap/sakamoto-desktop
          brew style --cask pi-dal/tap/sakamoto-desktop
          brew install --cask pi-dal/tap/sakamoto-desktop
          codesign --verify --deep --strict /Applications/Sakamoto.app
          codesign --display --verbose=4 /Applications/Sakamoto.app 2>&1 | rg -q 'TeamIdentifier=6Y2YB464VU'
          xcrun stapler validate /Applications/Sakamoto.app
          spctl --assess --type execute --verbose=4 /Applications/Sakamoto.app
